<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اقضيها للمناديب – البطاقة والعربية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C5C}a:hover{color:#0A3540}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; font-family: 'Cairo', sans-serif; color: #1F2A30; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 48px 20px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 6px">
<div style="flex: 1; height: 6px; border-radius: 3px; background: #2A9D8F"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #2A9D8F"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #2A9D8F"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #0F4C5C"></div>
</div>
<p style="margin: 0; font-size: 13px; color: #5B6770">خطوة ٤ من ٤ · البطاقة والعربية</p>
<h1 style="margin: 0; font-size: 22px; font-weight: 700">البطاقة والعربية</h1>
</div>

<div style="flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 14px">

<div style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<p style="margin: 0; font-size: 15px; font-weight: 700">البطاقة الشخصية <span style="color: #C1121F">*</span></p>
<span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #1B6B61">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1B6B61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
محفوظة ومشفّرة</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #DDF1EE; border: 2px solid #2A9D8F; border-radius: 14px; font-family: 'Cairo', sans-serif; cursor: pointer">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B6B61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
<span style="font-size: 13px; font-weight: 700; color: #1B6B61">الوش اتصوّر</span>
<span style="font-size: 11px; color: #1B6B61">صوّر تاني</span>
</button>
<button type="button" style="height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #F7F5F0; border: 2px dashed #0F4C5C; border-radius: 14px; font-family: 'Cairo', sans-serif; cursor: pointer">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0F4C5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 14h6M7 10h3"></path></svg>
<span style="font-size: 13px; font-weight: 700; color: #0F4C5C">صوّر الضهر</span>
</button>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 15px; font-weight: 700">بتوصّل بإيه؟ <span style="color: #C1121F">*</span></p>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<p style="margin: 6px 0 0; font-size: 15px; font-weight: 700">لونها <span style="color: #C1121F">*</span></p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-label="{{c.label}}" style="{{c.style}}"><span style="{{c.dot}}"></span><span>{{c.label}}</span></button>
</sc-for>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; margin-top: 4px">رقم اللوحة (لو موجودة)
<input type="text" placeholder="س ع د ١٢٣" style="height: 48px; box-sizing: border-box; padding: 0 14px; background: #F7F5F0; border: 1px solid #D9D6CE; border-radius: 12px; font-family: 'Cairo', sans-serif; font-size: 15px; color: #1F2A30; outline: none"></label>
</div>

<div style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 15px; font-weight: 700">صورة العربية <span style="color: #C1121F">*</span></p>
<button type="button" style="height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #F7F5F0; border: 2px dashed #0F4C5C; border-radius: 14px; font-family: 'Cairo', sans-serif; cursor: pointer">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0F4C5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3"></circle><circle cx="18" cy="17" r="3"></circle><path d="M6 17l4-7h5l3 7M10 10l-1-3H6M15 10l1-3h3"></path></svg>
<span style="font-size: 13px; font-weight: 700; color: #0F4C5C">صوّر العربية كلها واللوحة باينة</span>
</button>
</div>

</div>

<div style="padding: 12px 20px 28px; background: #FFFFFF; border-top: 1px solid #E6E2D8">
<a href="CPending.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; background: #FFB703; border-radius: 16px; font-size: 17px; font-weight: 700; color: #3A2A00; text-decoration: none">ابعت بياناتي للمراجعة</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { type: 'موتوسيكل', color: 'أحمر' }; }
  renderVals() {
    const st = this.state;
    const tb = (on) => 'height: 46px; border-radius: 12px; font-family: Cairo, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #0F4C5C; color: #FFFFFF; border: 1px solid #0F4C5C;' : 'background: #F7F5F0; color: #1F2A30; border: 1px solid #D9D6CE;');
    const cols = [['أحمر', '#D62828'], ['أسود', '#1F2A30'], ['أبيض', '#FFFFFF'], ['أزرق', '#1D4ED8'], ['فضي', '#B8C2C7'], ['تاني', '#E6E2D8']];
    return {
      types: ['موتوسيكل', 'سكوتر', 'عجلة', 'عربية'].map((t) => ({ label: t, style: tb(st.type === t), pick: () => this.setState({ type: t }) })),
      colors: cols.map((c) => {
        const on = st.color === c[0];
        return {
          label: c[0], pick: () => this.setState({ color: c[0] }),
          style: 'height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 999px; font-family: Cairo, sans-serif; font-size: 13px; font-weight: 700; color: #1F2A30; cursor: pointer; ' + (on ? 'background: #E1EEF0; border: 2px solid #0F4C5C;' : 'background: #FFFFFF; border: 1px solid #D9D6CE;'),
          dot: 'width: 18px; height: 18px; border-radius: 50%; border: 1px solid #B8B4AA; background: ' + c[1] + ';'
        };
      })
    };
  }
}
</script>
</body>
</html>
