<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اقضيها – رقم الموبايل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C5C}a:hover{color:#0A3540}
input::placeholder{color:#8A949A}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; font-family: 'Cairo', sans-serif; color: #1F2A30; display: flex; flex-direction: column; overflow: hidden">

<div style="background: #0F4C5C; padding: 72px 24px 64px; display: flex; flex-direction: column; align-items: center; gap: 14px; border-radius: 0 0 36px 36px">
<svg width="84" height="84" viewBox="0 0 64 64" role="img" aria-label="لوجو اقضيها">
<rect x="0" y="0" width="64" height="64" rx="16" fill="#FFB703"></rect>
<path d="M27 13 q2 -4 5 -1 q2 -4 5 0" fill="none" stroke="#0F4C5C" stroke-width="2" stroke-linecap="round"></path>
<circle cx="32" cy="21" r="8" fill="#F7F5F0" stroke="#0F4C5C" stroke-width="2.2"></circle>
<circle cx="29" cy="20" r="1.6" fill="#0F4C5C"></circle>
<circle cx="35" cy="20" r="1.6" fill="#0F4C5C"></circle>
<ellipse cx="32" cy="25" rx="1.6" ry="1.9" fill="#0F4C5C"></ellipse>
<path d="M14 27 H50 L47 51 a4 4 0 0 1 -4 3.5 H21 a4 4 0 0 1 -4 -3.5 Z" fill="#0F4C5C"></path>
<path d="M24 37 a8 8 0 0 0 16 0" fill="none" stroke="#FFB703" stroke-width="2.6" stroke-linecap="round"></path>
<circle cx="22" cy="27" r="3.2" fill="#F7F5F0" stroke="#0F4C5C" stroke-width="2"></circle>
<circle cx="42" cy="27" r="3.2" fill="#F7F5F0" stroke="#0F4C5C" stroke-width="2"></circle>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<p style="margin: 0; font-size: 34px; font-weight: 800; color: #FFFFFF; line-height: 1.2">اقضيها</p>
<p style="margin: 0; font-size: 15px; color: #CFE6EA">أي حاجة من أي محل، لحد باب البيت</p>
</div>
</div>

<div style="flex: 1; padding: 32px 24px 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; color: #1F2A30">أهلاً بيك</h1>
<p style="margin: 0; font-size: 15px; color: #5B6770">اكتب رقم موبايلك وهنبعتلك كود تفعيل على واتساب</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="phone" style="font-size: 14px; font-weight: 600; color: #1F2A30">رقم الموبايل</label>
<div dir="ltr" style="display: flex; gap: 8px">
<div style="height: 54px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #D9D6CE; border-radius: 14px; font-size: 16px; font-weight: 600; color: #1F2A30">+20</div>
<input id="phone" type="tel" inputmode="numeric" placeholder="10 1234 5678" style="flex: 1; min-width: 0; height: 54px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 2px solid #0F4C5C; border-radius: 14px; font-family: 'Cairo', sans-serif; font-size: 17px; letter-spacing: 1px; color: #1F2A30; outline: none">
</div>
</div>

<label style="display: flex; align-items: flex-start; gap: 12px; cursor: pointer; padding: 4px 0">
<input type="checkbox" checked="{{agreed}}" onChange="{{toggle}}" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #0F4C5C; flex-shrink: 0; cursor: pointer">
<span style="font-size: 14px; line-height: 1.7; color: #1F2A30">قريت وموافق على <a href="Terms.dc.html" style="color: #0F4C5C; font-weight: 700; text-decoration: underline">الشروط والأحكام</a> وسياسة الخصوصية</span>
</label>

<div style="flex: 1"></div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{agreed}}" hint-placeholder-val="{{ true }}">
<a href="Otp.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #FFB703; border-radius: 16px; font-size: 17px; font-weight: 700; color: #1F2A30; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.5A8.5 8.5 0 1 1 8 20.2z"></path><path d="M9 11.5c.5 1.5 1.8 2.8 3.5 3.5"></path></svg>
ابعتلي الكود على واتساب
</a>
</sc-if>
<sc-if value="{{notAgreed}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{nudge}}" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #E6E2D8; border: none; border-radius: 16px; font-family: 'Cairo', sans-serif; font-size: 17px; font-weight: 700; color: #6E6A61; cursor: pointer">ابعتلي الكود على واتساب</button>
<sc-if value="{{showHint}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 13px; color: #C1121F; text-align: center">لازم توافق على الشروط والأحكام الأول</p>
</sc-if>
</sc-if>
<p style="margin: 0; font-size: 14px; color: #5B6770; text-align: center">عندك حساب؟ <a href="Login.dc.html" style="color: #0F4C5C; font-weight: 800">سجّل دخول</a></p>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { agreed: false, showHint: false }; }
  renderVals() {
    const agreed = !!this.state.agreed;
    return {
      agreed: agreed,
      notAgreed: !agreed,
      showHint: !!this.state.showHint,
      toggle: () => this.setState({ agreed: !agreed, showHint: false }),
      nudge: () => this.setState({ showHint: true })
    };
  }
}
</script>
</body>
</html>
