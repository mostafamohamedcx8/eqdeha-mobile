<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اقضيها – كود التفعيل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C5C}a:hover{color:#0A3540}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; font-family: 'Cairo', sans-serif; color: #1F2A30; display: flex; flex-direction: column; padding: 52px 24px 30px; gap: 28px; overflow: hidden">

<a href="Main.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #FFFFFF; border: 1px solid #E6E2D8; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<div style="width: 76px; height: 76px; border-radius: 24px; background: #E1EEF0; display: flex; align-items: center; justify-content: center">
<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0F4C5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.5A8.5 8.5 0 1 1 8 20.2z"></path><path d="M9 12l2 2 4-4"></path></svg>
</div>
<h1 style="margin: 0; font-size: 24px; font-weight: 700; color: #1F2A30">اكتب الكود اللي وصلك</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #5B6770">بعتنالك كود من ٦ أرقام على واتساب على رقم<br><span dir="ltr" style="font-weight: 700; color: #1F2A30">+20 10 1234 5678</span></p>
<a href="Main.dc.html" style="font-size: 14px; font-weight: 700; color: #0F4C5C">تغيير الرقم</a>
</div>

<div dir="ltr" style="display: flex; justify-content: center; gap: 8px">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
<div style="{{b.style}}">{{b.digit}}</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<p style="margin: 0; font-size: 14px; color: #5B6770">مجالكش الكود؟ تقدر تطلب كود جديد بعد <span dir="ltr" style="font-weight: 700; color: #1F2A30">00:45</span></p>
<p style="margin: 0; font-size: 13px; color: #8A949A">ومش لازم تقفل التطبيق، هنقرأ الكود لوحدنا</p>
</div>

<div style="flex: 1"></div>

<a href="Profile.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; background: #FFB703; border-radius: 16px; font-size: 17px; font-weight: 700; color: #1F2A30; text-decoration: none">تأكيد</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const digits = ['4', '8', '2', '', '', ''];
    const base = 'width: 48px; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border-radius: 14px; font-size: 26px; font-weight: 700; color: #1F2A30; ';
    return {
      boxes: digits.map((d, i) => ({
        digit: d,
        style: base + (i === 3 ? 'border: 2px solid #0F4C5C;' : d ? 'border: 1.5px solid #2A9D8F;' : 'border: 1px solid #D9D6CE;')
      }))
    };
  }
}
</script>
</body>
</html>
