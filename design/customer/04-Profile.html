<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اقضيها – بياناتك</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C5C}a:hover{color:#0A3540}
input::placeholder{color:#8A949A}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; font-family: 'Cairo', sans-serif; color: #1F2A30; display: flex; flex-direction: column; padding: 48px 24px 28px; gap: 18px; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 6px">
<div style="flex: 1; height: 6px; border-radius: 3px; background: #2A9D8F"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #2A9D8F"></div>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #0F4C5C"></div>
</div>
<p style="margin: 0; font-size: 13px; color: #5B6770">خطوة ٣ من ٣</p>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; color: #1F2A30">كمّل بياناتك</h1>
<p style="margin: 0; font-size: 15px; color: #5B6770">خطوة أخيرة وتبدأ تطلب</p>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 14px">
<button type="button" aria-label="ضيف صورتك" style="position: relative; width: 76px; height: 76px; flex-shrink: 0; padding: 0; border-radius: 50%; background: #E1EEF0; border: 2px dashed #0F4C5C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0F4C5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="4"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
<span style="position: absolute; bottom: -2px; left: -2px; width: 28px; height: 28px; border-radius: 50%; background: #FFB703; border: 2px solid #F7F5F0; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A2A00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3"></circle></svg>
</span>
</button>
<div style="display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 700; color: #1F2A30">صورتك الشخصية</span>
<span style="font-size: 13px; color: #5B6770">اختياري · من الكاميرا أو المعرض</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fullname" style="font-size: 14px; font-weight: 600; color: #1F2A30">الاسم بالكامل</label>
<input id="fullname" type="text" placeholder="أحمد محمد علي" style="height: 52px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 2px solid #0F4C5C; border-radius: 14px; font-family: 'Cairo', sans-serif; font-size: 16px; color: #1F2A30; outline: none">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 600; color: #1F2A30">الإيميل</label>
<input id="email" type="email" dir="ltr" placeholder="name@gmail.com" style="height: 52px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 1px solid #D9D6CE; border-radius: 14px; font-family: 'Cairo', sans-serif; font-size: 16px; color: #1F2A30; text-align: right; outline: none">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="dob" style="font-size: 14px; font-weight: 600; color: #1F2A30">تاريخ الميلاد</label>
<div style="position: relative">
<input id="dob" type="text" placeholder="يوم / شهر / سنة" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px 0 48px; background: #FFFFFF; border: 1px solid #D9D6CE; border-radius: 14px; font-family: 'Cairo', sans-serif; font-size: 16px; color: #1F2A30; outline: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6770" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 16px; top: 15px"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 14px; font-weight: 600; color: #1F2A30">النوع</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" onClick="{{pickMale}}" style="{{maleStyle}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="14" r="5"></circle><path d="M14 10l6-6M15 4h5v5"></path></svg>
ذكر
</button>
<button type="button" onClick="{{pickFemale}}" style="{{femaleStyle}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5"></circle><path d="M12 14v7M9 18h6"></path></svg>
أنثى
</button>
</div>
</div>

</div>

<div style="flex: 1"></div>

<div style="display: flex; flex-direction: column; gap: 10px">
<a href="Home.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; background: #FFB703; border-radius: 16px; font-size: 17px; font-weight: 700; color: #1F2A30; text-decoration: none">يلا نبدأ</a>
<p style="margin: 0; font-size: 12px; color: #5B6770; text-align: center">بياناتك محفوظة ومش هتظهر لحد غير المندوب وقت الأوردر</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { gender: 'male' }; }
  renderVals() {
    const base = 'height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; font-family: Cairo, sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; ';
    const on = base + 'background: #0F4C5C; border: 2px solid #0F4C5C; color: #FFFFFF;';
    const off = base + 'background: #FFFFFF; border: 1px solid #D9D6CE; color: #1F2A30;';
    const g = this.state.gender;
    return {
      maleStyle: g === 'male' ? on : off,
      femaleStyle: g === 'female' ? on : off,
      pickMale: () => this.setState({ gender: 'male' }),
      pickFemale: () => this.setState({ gender: 'female' })
    };
  }
}
</script>
</body>
</html>
