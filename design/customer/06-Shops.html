<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اقضيها – المحلات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C5C}a:hover{color:#0A3540}
input::placeholder{color:#8A949A}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; font-family: 'Cairo', sans-serif; color: #1F2A30; display: flex; flex-direction: column; overflow: hidden">

<div style="background: #0F4C5C; padding: 50px 16px 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Home.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #1A5E70; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<h1 style="margin: 0; font-size: 20px; font-weight: 700; color: #FFFFFF">المحلات</h1>
</div>
<div style="position: relative">
<label for="shopSearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">دوّر باسم المحل</label>
<input id="shopSearch" type="search" value="{{q}}" onChange="{{onSearch}}" placeholder="دوّر باسم المحل" style="width: 100%; height: 50px; box-sizing: border-box; padding: 0 46px 0 16px; background: #FFFFFF; border: none; border-radius: 14px; font-family: 'Cairo', sans-serif; font-size: 15px; color: #1F2A30; outline: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6770" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 16px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
</div>
</div>

<div style="padding: 14px 0 6px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border-bottom: 1px solid #E6E2D8">
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 0 16px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 0 16px 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6770" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
<sc-for list="{{streets}}" as="s" hint-placeholder-count="4">
<button type="button" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
</sc-for>
</div>
</div>

<div style="flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 13px; color: #5B6770">{{countLabel}}</p>
<sc-for list="{{shops}}" as="s" hint-placeholder-count="5">
<a href="ShopOrder.dc.html" style="{{s.cardStyle}}">
<span style="{{s.tileStyle}}">{{s.initial}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700; color: #1F2A30">{{s.name}}</span>
<span style="font-size: 13px; color: #5B6770">{{s.cat}} · {{s.street}}</span>
<span style="font-size: 12px; color: #5B6770">{{s.hours}}</span>
</span>
<span style="{{s.pillStyle}}">{{s.status}}</span>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 40px 16px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center">
<p style="margin: 0; font-size: 16px; font-weight: 700; color: #1F2A30">مفيش محلات بالفلتر ده</p>
<p style="margin: 0; font-size: 14px; color: #5B6770">جرّب تغيّر النوع أو الشارع، أو اطلب أي حاجة والمندوب يدوّرلك</p>
<a href="AnyOrder.dc.html" style="margin-top: 6px; padding: 10px 18px; background: #FFB703; border-radius: 12px; font-size: 14px; font-weight: 700; color: #3A2A00; text-decoration: none">اطلب أي حاجة</a>
</div>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'الكل', street: 'كل الشوارع', q: '' }; }
  renderVals() {
    const all = [
      { name: 'مشويات أبو علي', cat: 'مشويات', street: 'ش. الجمهورية', open: true, hours: 'مفتوح لحد ١٢ بالليل', bg: '#FDEBDD', fg: '#B4471B' },
      { name: 'صيدلية الشفاء', cat: 'صيدليات', street: 'ش. النصر', open: true, hours: 'مفتوح ٢٤ ساعة', bg: '#E1EEF0', fg: '#0F4C5C' },
      { name: 'سوبر ماركت الأمانة', cat: 'سوبر ماركت', street: 'ش. الجمهورية', open: true, hours: 'مفتوح لحد ٢ بالليل', bg: '#FFF1CC', fg: '#8A5A00' },
      { name: 'فكهاني الحاج سيد', cat: 'خضار وفاكهة', street: 'ش. المدارس', open: true, hours: 'مفتوح لحد ١١ بالليل', bg: '#E3F1DF', fg: '#3B6D11' },
      { name: 'أسماك البحر', cat: 'أسماك', street: 'ش. النصر', open: false, hours: 'بيفتح الساعة ١ الضهر', bg: '#DDEFF7', fg: '#185FA5' },
      { name: 'جزارة الإخلاص', cat: 'جزارة', street: 'ش. المدارس', open: true, hours: 'مفتوح لحد ١٠ بالليل', bg: '#FBE3E4', fg: '#A32D2D' },
      { name: 'ملابس النور', cat: 'ملابس', street: 'ش. الجمهورية', open: false, hours: 'بيفتح الساعة ١١ الصبح', bg: '#EEEDFE', fg: '#534AB7' },
      { name: 'مخبز العيلة', cat: 'مخبوزات', street: 'ش. المدارس', open: true, hours: 'مفتوح لحد ٩ بالليل', bg: '#F5EBDD', fg: '#854F0B' }
    ];
    const st = this.state;
    const chip = (on) => 'flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; font-family: Cairo, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; ' + (on ? 'background: #0F4C5C; color: #FFFFFF; border: 1px solid #0F4C5C;' : 'background: #F7F5F0; color: #1F2A30; border: 1px solid #D9D6CE;');
    const schip = (on) => 'flex-shrink: 0; height: 32px; padding: 0 12px; border-radius: 10px; font-family: Cairo, sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; ' + (on ? 'background: #FFF1CC; color: #5C4300; border: 1px solid #FFB703;' : 'background: #FFFFFF; color: #5B6770; border: 1px solid #D9D6CE;');
    const catNames = ['الكل', 'مشويات', 'صيدليات', 'سوبر ماركت', 'خضار وفاكهة', 'أسماك', 'جزارة', 'ملابس', 'مخبوزات'];
    const streetNames = ['كل الشوارع', 'ش. الجمهورية', 'ش. النصر', 'ش. المدارس'];
    const q = (st.q || '').trim();
    const shops = all.filter((s) => (st.cat === 'الكل' || s.cat === st.cat) && (st.street === 'كل الشوارع' || s.street === st.street) && (!q || s.name.indexOf(q) !== -1)).map((s) => ({
      name: s.name, cat: s.cat, street: s.street, hours: s.hours,
      initial: s.name.replace('مشويات ', '').replace('صيدلية ', '').replace('سوبر ماركت ', '').replace('فكهاني ', '').replace('أسماك ', '').replace('جزارة ', '').replace('ملابس ', '').replace('مخبز ', '').replace('ال', '').charAt(0),
      status: s.open ? 'مفتوح' : 'مقفول',
      cardStyle: 'display: flex; align-items: center; gap: 12px; padding: 12px; background: #FFFFFF; border-radius: 18px; text-decoration: none; ' + (s.open ? '' : 'opacity: 0.6;'),
      tileStyle: 'width: 56px; height: 56px; flex-shrink: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; background: ' + s.bg + '; color: ' + s.fg + ';',
      pillStyle: 'flex-shrink: 0; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; ' + (s.open ? 'background: #DDF1EE; color: #1B6B61;' : 'background: #FBE3E4; color: #A32D2D;')
    }));
    return {
      q: st.q,
      onSearch: (e) => this.setState({ q: e.target.value }),
      cats: catNames.map((c) => ({ label: c, style: chip(c === st.cat), pick: () => this.setState({ cat: c }) })),
      streets: streetNames.map((s) => ({ label: s, style: schip(s === st.street), pick: () => this.setState({ street: s }) })),
      shops: shops,
      empty: shops.length === 0,
      countLabel: shops.length + ' محل في منطقتك'
    };
  }
}
</script>
</body>
</html>
