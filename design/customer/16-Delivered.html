<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اقضيها – تم التسليم</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C5C}a:hover{color:#0A3540}
textarea::placeholder{color:#8A949A}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; font-family: 'Cairo', sans-serif; color: #1F2A30; display: flex; flex-direction: column; overflow: hidden">

<div style="flex: 1; overflow-y: auto; overflow-x: hidden; padding: 60px 20px 16px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="width: 84px; height: 84px; border-radius: 50%; background: #DDF1EE; display: flex; align-items: center; justify-content: center">
<span style="width: 60px; height: 60px; border-radius: 50%; background: #2A9D8F; display: flex; align-items: center; justify-content: center">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
</span>
</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 800; color: #1F2A30">أوردرك وصل، بالهنا</h1>
<p style="margin: 0; font-size: 14px; color: #5B6770">أوردر #١٠٤٢ · دفعت ٢٩٠ ج كاش</p>
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 14px; background: #FFF1CC; border-radius: 999px; font-size: 14px; font-weight: 800; color: #5C4300"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFB703" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>+١٠ نقاط اتضافوا لحسابك</span>
<a href="FinalInvoice.dc.html" style="font-size: 14px; font-weight: 700">شوف الفاتورة</a>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<span style="width: 60px; height: 60px; border-radius: 50%; background: #E1EEF0; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #0F4C5C">م</span>
<p style="margin: 0; font-size: 16px; font-weight: 700">إيه رأيك في محمود؟</p>
<div style="display: flex; gap: 6px" dir="ltr">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
<button type="button" onClick="{{s.pick}}" aria-label="{{s.label}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; padding: 0">
<svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.4" stroke-linejoin="round"></path></svg>
</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 700; color: #8A5A00">{{starText}}</p>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<textarea aria-label="تعليق" rows="2" placeholder="عايز تقول حاجة؟ (اختياري)" style="width: 100%; box-sizing: border-box; padding: 10px 14px; background: #F7F5F0; border: 1px solid #D9D6CE; border-radius: 14px; font-family: 'Cairo', sans-serif; font-size: 14px; color: #1F2A30; resize: none; outline: none"></textarea>
</div>

<a href="#" style="align-self: center; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #C1121F">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C1121F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
في مشكلة في الأوردر؟</a>

</div>

<div style="padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 8px">
<a href="Home.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; background: #FFB703; border-radius: 16px; font-size: 17px; font-weight: 800; color: #3A2A00; text-decoration: none">ابعت التقييم</a>
<a href="Home.dc.html" style="height: 40px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #5B6770; text-decoration: none">بعدين</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { stars: 5, tags: ['سريع'] }; }
  renderVals() {
    const n = this.state.stars, tags = this.state.tags;
    const words = ['', 'وحش', 'مش أوي', 'كويس', 'حلو', 'ممتاز'];
    return {
      starText: words[n],
      stars: [1, 2, 3, 4, 5].map((i) => ({
        label: i + ' نجوم', fill: i <= n ? '#FFB703' : '#FFFFFF', stroke: i <= n ? '#E0A000' : '#D9D6CE',
        pick: () => this.setState({ stars: i })
      })),
      tags: ['سريع', 'محترم', 'الحاجة سليمة', 'ردّ عليا بسرعة'].map((t) => {
        const on = tags.indexOf(t) !== -1;
        return {
          label: t,
          pick: () => this.setState({ tags: on ? tags.filter((x) => x !== t) : tags.concat([t]) }),
          style: 'height: 36px; padding: 0 14px; border-radius: 999px; font-family: Cairo, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #0F4C5C; color: #FFFFFF; border: 1px solid #0F4C5C;' : 'background: #FFFFFF; color: #1F2A30; border: 1px solid #D9D6CE;')
        };
      })
    };
  }
}
</script>
</body>
</html>
