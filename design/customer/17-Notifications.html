<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اقضيها – الإشعارات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C5C}a:hover{color:#0A3540}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; font-family: 'Cairo', sans-serif; color: #1F2A30; display: flex; flex-direction: column; overflow: hidden">

<div style="background: #1F2A30; padding: 46px 14px 16px; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0 4px 2px; font-size: 12px; font-weight: 600; color: #B8C2C7">كده هتظهر على شاشة الموبايل</p>
<div style="display: flex; gap: 10px; padding: 10px 12px; background: #F2F2F0; border-radius: 18px">
<svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true" style="flex-shrink: 0"><rect width="64" height="64" rx="14" fill="#FFB703"></rect><circle cx="32" cy="21" r="8" fill="#F7F5F0" stroke="#0F4C5C" stroke-width="2.2"></circle><path d="M14 27H50L47 51a4 4 0 0 1-4 3.5H21a4 4 0 0 1-4-3.5Z" fill="#0F4C5C"></path></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between"><span style="font-size: 12px; font-weight: 700; color: #5B6770">اقضيها</span><span style="font-size: 11px; color: #5B6770">دلوقتي</span></div>
<span style="font-size: 14px; font-weight: 800; color: #1F2A30">المندوب اشترى من مشويات أبو علي</span>
<span style="font-size: 13px; color: #1F2A30">الفاتورة ١٩٥ ج. افتح وشوفها</span>
</div>
</div>
<div style="display: flex; gap: 10px; padding: 10px 12px; background: #F2F2F0; border-radius: 18px">
<svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true" style="flex-shrink: 0"><rect width="64" height="64" rx="14" fill="#FFB703"></rect><circle cx="32" cy="21" r="8" fill="#F7F5F0" stroke="#0F4C5C" stroke-width="2.2"></circle><path d="M14 27H50L47 51a4 4 0 0 1-4 3.5H21a4 4 0 0 1-4-3.5Z" fill="#0F4C5C"></path></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between"><span style="font-size: 12px; font-weight: 700; color: #5B6770">اقضيها</span><span style="font-size: 11px; color: #5B6770">من ٣ دقايق</span></div>
<span style="font-size: 14px; font-weight: 800; color: #1F2A30">محمود قبل أوردرك</span>
<span style="font-size: 13px; color: #1F2A30">في الطريق للمحل، وتقدر تكلّمه من الشات</span>
</div>
</div>
</div>

<div style="padding: 16px 16px 8px; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 20px; font-weight: 800; color: #1F2A30">الإشعارات</h1>
<button type="button" onClick="{{readAll}}" style="height: 36px; padding: 0 12px; background: transparent; border: none; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700; color: #0F4C5C; cursor: pointer">اعتبرها كلها مقروءة</button>
</div>

<div style="flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="6">
<a href="{{n.href}}" style="{{n.cardStyle}}">
<span style="{{n.iconStyle}}">{{n.glyph}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 800; color: #1F2A30">{{n.title}}</span>
<span style="font-size: 13px; line-height: 1.5; color: #5B6770">{{n.body}}</span>
<span style="font-size: 11px; color: #8A949A">{{n.time}}</span>
</span>
<sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}">
<span style="width: 10px; height: 10px; flex-shrink: 0; border-radius: 50%; background: #E63946"></span>
</sc-if>
</a>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { read: false }; }
  renderVals() {
    const kinds = {
      invoice: { g: 'ف', bg: '#FFF1CC', fg: '#8A5A00' },
      order: { g: '✓', bg: '#DDF1EE', fg: '#1B6B61' },
      offer: { g: 'ع', bg: '#E1EEF0', fg: '#0F4C5C' },
      chat: { g: 'ش', bg: '#EEEDFE', fg: '#534AB7' },
      money: { g: '★', bg: '#FFF1CC', fg: '#8A5A00' },
      pending: { g: '…', bg: '#F1EFE8', fg: '#5B6770' },
      cancel: { g: '×', bg: '#FBE3E4', fg: '#A32D2D' }
    };
    const data = [
      { k: 'invoice', t: 'فاتورة جديدة من مشويات أبو علي', b: 'المندوب اشترى أول حاجة · ١٩٥ ج', time: 'دلوقتي', u: true, href: 'Invoice.dc.html' },
      { k: 'chat', t: 'رسالة من محمود', b: 'الفراخ المشوية خلصت، ينفع بانيه بدلها؟', time: 'من دقيقة', u: true, href: 'Chat.dc.html' },
      { k: 'order', t: 'محمود قبل أوردرك', b: 'في الطريق لمشويات أبو علي', time: 'من ٣ دقايق', u: false, href: 'Tracking.dc.html' },
      { k: 'offer', t: 'عرض جديد على طلبك', b: 'كريم عرض توصيل بـ ٢٠ ج', time: 'من ٥ دقايق', u: false, href: 'Offers.dc.html' },
      { k: 'money', t: 'اتضافلك ١٠ نقاط', b: 'على أوردر #١٠٤٠ · مجموع نقاطك بقى ١٢٠', time: 'أمس', u: false, href: 'Points.dc.html' },
      { k: 'order', t: 'أوردرك وصل', b: 'قيّم المندوب وقولنا رأيك', time: '٣ نوفمبر', u: false, href: 'Delivered.dc.html' },
      { k: 'cancel', t: 'المندوب لغى الأوردر', b: 'ولا يهمك، طلبك رجع لباقي المناديب', time: '٢ نوفمبر', u: false, href: 'Tracking.dc.html' }
    ];
    const read = this.state.read;
    return {
      readAll: () => this.setState({ read: true }),
      items: data.map((d) => {
        const k = kinds[d.k], unread = d.u && !read;
        return {
          title: d.t, body: d.b, time: d.time, glyph: k.g, href: d.href, unread: unread,
          cardStyle: 'display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 16px; text-decoration: none; ' + (unread ? 'background: #FFFFFF; border: 1px solid #FFB703;' : 'background: #FFFFFF; border: 1px solid #FFFFFF;'),
          iconStyle: 'width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; background: ' + k.bg + '; color: ' + k.fg + ';'
        };
      })
    };
  }
}
</script>
</body>
</html>
