<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اقضيها – تقييمات المندوب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C5C}a:hover{color:#0A3540}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; font-family: 'Cairo', sans-serif; color: #1F2A30; display: flex; flex-direction: column; overflow: hidden">

<div style="background: #0F4C5C; padding: 50px 16px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; border-radius: 0 0 28px 28px">
<div style="align-self: stretch; display: flex; align-items: center">
<a href="Tracking.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #1A5E70; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>
<span style="width: 84px; height: 84px; border-radius: 50%; background: #E1EEF0; border: 3px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; color: #0F4C5C; margin-top: -20px">م</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<h1 style="margin: 0; font-size: 21px; font-weight: 800; color: #FFFFFF">محمود سعيد</h1>
<span style="display: flex; align-items: center; gap: 6px; padding: 2px 10px; background: #1A5E70; border-radius: 999px; font-size: 12px; font-weight: 700; color: #FFFFFF">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2A9D8F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
بياناته اتراجعت من الإدارة</span>
<p style="margin: 0; font-size: 13px; color: #CFE6EA">موتوسيكل أحمر · معانا من مارس ٢٠٢٦</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-self: stretch">
<div style="padding: 8px; background: #1A5E70; border-radius: 12px; text-align: center"><p style="margin: 0; font-size: 18px; font-weight: 800; color: #FFFFFF">٤٫٩</p><p style="margin: 0; font-size: 11px; color: #CFE6EA">التقييم</p></div>
<div style="padding: 8px; background: #1A5E70; border-radius: 12px; text-align: center"><p style="margin: 0; font-size: 18px; font-weight: 800; color: #FFFFFF">٢١٠</p><p style="margin: 0; font-size: 11px; color: #CFE6EA">مشوار</p></div>
<div style="padding: 8px; background: #1A5E70; border-radius: 12px; text-align: center"><p style="margin: 0; font-size: 18px; font-weight: 800; color: #FFFFFF">٩٨٪</p><p style="margin: 0; font-size: 11px; color: #CFE6EA">كمّل أوردراته</p></div>
</div>
</div>

<div style="flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px">

<div style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; gap: 16px; align-items: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 80px">
<span style="font-size: 38px; font-weight: 800; line-height: 1.1; color: #1F2A30">٤٫٩</span>
<span dir="ltr" style="display: flex; gap: 1px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="#FFB703" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
<svg width="14" height="14" viewBox="0 0 24 24" fill="#FFB703" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
<svg width="14" height="14" viewBox="0 0 24 24" fill="#FFB703" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
<svg width="14" height="14" viewBox="0 0 24 24" fill="#FFB703" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
<svg width="14" height="14" viewBox="0 0 24 24" fill="#FFB703" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
</span>
<span style="font-size: 12px; color: #5B6770">١٨٤ تقييم</span>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5B6770">
<span style="width: 10px">{{b.n}}</span>
<span style="flex: 1; height: 8px; border-radius: 4px; background: #F1EFE8; overflow: hidden; display: flex"><span style="{{b.fill}}"></span></span>
<span style="width: 26px; text-align: left">{{b.count}}</span>
</div>
</sc-for>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 14px; font-weight: 700; color: #1F2A30">الناس قالوا عنه</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 4px 12px; border-radius: 999px; background: #DDF1EE; font-size: 13px; font-weight: 700; color: #1B6B61">سريع · ١٢٠</span>
<span style="padding: 4px 12px; border-radius: 999px; background: #DDF1EE; font-size: 13px; font-weight: 700; color: #1B6B61">محترم · ٩٥</span>
<span style="padding: 4px 12px; border-radius: 999px; background: #DDF1EE; font-size: 13px; font-weight: 700; color: #1B6B61">الحاجة سليمة · ٨٠</span>
<span style="padding: 4px 12px; border-radius: 999px; background: #DDF1EE; font-size: 13px; font-weight: 700; color: #1B6B61">ردّ بسرعة · ٦٤</span>
</div>
</div>

<div style="display: flex; gap: 6px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>

<sc-for list="{{reviews}}" as="r" hint-placeholder-count="3">
<div style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #F1EFE8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #5B6770">{{r.initial}}</span>
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 700">{{r.name}}</span>
<span style="font-size: 11px; color: #8A949A">{{r.date}}</span>
</span>
<span style="{{r.badgeStyle}}">{{r.stars}} ★</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #1F2A30">{{r.text}}</p>
</div>
</sc-for>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'all' }; }
  renderVals() {
    const counts = [[5, 162], [4, 15], [3, 4], [2, 2], [1, 1]];
    const toAr = (x) => String(x).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
    const all = [
      { initial: 'س', name: 'سارة م.', date: 'من يومين', s: 5, t: 'جه بسرعة جداً وكان بيبعتلي صور الحاجة قبل ما يشتري. محترم جداً.' },
      { initial: 'ع', name: 'عمر ح.', date: 'من ٤ أيام', s: 5, t: 'الأكل وصل سخن، وكلّمني لما الصنف خلص بدل ما يجيب أي حاجة.' },
      { initial: 'م', name: 'مها ع.', date: 'الأسبوع اللي فات', s: 3, t: 'كويس بس اتأخر شوية عن الوقت اللي قاله.' },
      { initial: 'خ', name: 'خالد ي.', date: 'من أسبوعين', s: 5, t: 'أحسن مندوب اتعاملت معاه في التطبيق.' }
    ];
    const f = this.state.f;
    const list = all.filter((r) => f === 'all' || (f === 'good' ? r.s >= 4 : r.s <= 3));
    const btn = (on) => 'flex: 1; height: 38px; border-radius: 10px; font-family: Cairo, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #0F4C5C; color: #FFFFFF; border: 1px solid #0F4C5C;' : 'background: #FFFFFF; color: #1F2A30; border: 1px solid #D9D6CE;');
    return {
      bars: counts.map((c) => ({ n: toAr(c[0]), count: toAr(c[1]), fill: 'height: 100%; border-radius: 4px; background: #FFB703; width: ' + Math.round(c[1] / 184 * 100) + '%;' })),
      filters: [['all', 'الكل'], ['good', 'الإيجابية'], ['bad', 'السلبية']].map((x) => ({ label: x[1], style: btn(f === x[0]), pick: () => this.setState({ f: x[0] }) })),
      reviews: list.map((r) => ({
        initial: r.initial, name: r.name, date: r.date, text: r.t, stars: toAr(r.s),
        badgeStyle: 'padding: 2px 8px; border-radius: 8px; font-size: 12px; font-weight: 800; ' + (r.s >= 4 ? 'background: #FFF1CC; color: #5C4300;' : 'background: #F1EFE8; color: #5B6770;')
      }))
    };
  }
}
</script>
</body>
</html>
