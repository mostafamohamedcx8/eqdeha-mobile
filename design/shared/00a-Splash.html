<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0 }; }
  componentDidMount() { this.timer = setInterval(() => this.setState({ t: (this.state.t + 1) % 3 }), 400); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const d = (i) => 'width: 10px; height: 10px; border-radius: 50%; background: ' + (this.state.t === i ? '#FFB703' : '#CFE6EA') + ';';
    return { d1: d(0), d2: d(1), d3: d(2) };
  }
}
</script>
