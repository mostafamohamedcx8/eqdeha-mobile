<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اقضيها – تسجيل الدخول</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C5C}a:hover{color:#0A3540}
input::placeholder{color:#8A949A}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; font-family: 'Cairo', sans-serif; color: #1F2A30; display: flex; flex-direction: column; overflow: hidden">

<div style="background: #0F4C5C; padding: 52px 20px 34px; display: flex; flex-direction: column; gap: 18px; border-radius: 0 0 32px 32px">
<a href="RolePick.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #1A5E70; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800; color: #FFFFFF">أهلاً بيك تاني</h1>
<p style="margin: 0; font-size: 15px; color: #CFE6EA">ادخل برقم موبايلك والباسورد</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #1A5E70; border-radius: 12px">
<button type="button" onClick="{{asCustomer}}" style="{{customerTab}}">عميل</button>
<button type="button" onClick="{{asCourier}}" style="{{courierTab}}">مندوب</button>
</div>
</div>

<div style="flex: 1; padding: 28px 24px 28px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="lphone" style="font-size: 14px; font-weight: 600">رقم الموبايل</label>
<div dir="ltr" style="display: flex; gap: 8px">
<div style="height: 54px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; background: #FFFFFF; border: 1px solid #D9D6CE; border-radius: 14px; font-size: 16px; font-weight: 600">+20</div>
<input id="lphone" type="tel" inputmode="numeric" placeholder="10 1234 5678" style="flex: 1; min-width: 0; height: 54px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 2px solid #0F4C5C; border-radius: 14px; font-family: 'Cairo', sans-serif; font-size: 17px; color: #1F2A30; outline: none">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="lpass" style="font-size: 14px; font-weight: 600">الباسورد</label>
<div style="position: relative">
<input id="lpass" type="{{passType}}" value="Eqdeha@2026" style="width: 100%; height: 54px; box-sizing: border-box; padding: 0 16px 0 52px; background: #FFFFFF; border: 1px solid #D9D6CE; border-radius: 14px; font-family: 'Cairo', sans-serif; font-size: 16px; color: #1F2A30; outline: none">
<button type="button" onClick="{{toggleShow}}" aria-label="{{eyeLabel}}" style="position: absolute; left: 6px; top: 5px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer">
<sc-if value="{{hidden}}" hint-placeholder-val="{{ true }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6770" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</sc-if>
<sc-if value="{{shown}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6770" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.6"></path></svg>
</sc-if>
</button>
</div>
<a href="#" style="align-self: flex-start; font-size: 14px; font-weight: 700">نسيت الباسورد؟</a>
</div>

<div style="flex: 1"></div>

<a href="{{loginHref}}" style="height: 56px; display: flex; align-items: center; justify-content: center; background: #FFB703; border-radius: 16px; font-size: 17px; font-weight: 800; color: #3A2A00; text-decoration: none">دخول</a>
<p style="margin: 0; font-size: 14px; color: #5B6770; text-align: center">مش عندك حساب؟ <a href="{{signupHref}}" style="font-weight: 800">{{signupLabel}}</a></p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { role: 'customer', show: false }; }
  renderVals() {
    const r = this.state.role, s = this.state.show;
    const tb = (on) => 'height: 40px; border: none; border-radius: 9px; font-family: Cairo, sans-serif; font-size: 14px; font-weight: 800; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #0F4C5C;' : 'background: transparent; color: #CFE6EA;');
    return {
      customerTab: tb(r === 'customer'), courierTab: tb(r === 'courier'),
      asCustomer: () => this.setState({ role: 'customer' }),
      asCourier: () => this.setState({ role: 'courier' }),
      passType: s ? 'text' : 'password', hidden: !s, shown: s,
      eyeLabel: s ? 'اخفي الباسورد' : 'اظهر الباسورد',
      toggleShow: () => this.setState({ show: !s }),
      loginHref: r === 'courier' ? 'CHome.dc.html' : 'Home.dc.html',
      signupHref: r === 'courier' ? 'CPhone.dc.html' : 'Main.dc.html',
      signupLabel: r === 'courier' ? 'سجّل كمندوب' : 'اعمل حساب'
    };
  }
}
</script>
</body>
</html>
